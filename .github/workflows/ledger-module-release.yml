# Builds the zip for the Twodsix Ledger module and puts it on a GitHub release.
#
# Release by pushing a tag that matches the version in modules/twodsix-ledger/module.json, for example version 0.4.0 is
# released with the tag ledger-v0.4.0. The "download" address in module.json must point at that release.

name: Release the Twodsix Ledger module

on:
  push:
    tags:
      - 'ledger-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/twodsix-ledger
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag, the version and the download address agree
        run: |
          version=$(jq -r .version module.json)
          download=$(jq -r .download module.json)
          if [ "${GITHUB_REF_NAME}" != "ledger-v${version}" ]; then
            echo "The tag is ${GITHUB_REF_NAME}, but module.json has version ${version} (expected ledger-v${version})." >&2
            exit 1
          fi
          case "${download}" in
            */releases/download/${GITHUB_REF_NAME}/twodsix-ledger.zip) ;;
            *) echo "The download address in module.json (${download}) does not point at the release ${GITHUB_REF_NAME}." >&2; exit 1 ;;
          esac

      - name: Build the zip (module.json must be at the root of it)
        run: |
          zip -r ../../twodsix-ledger.zip module.json README.md scripts styles templates lang

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ../../twodsix-ledger.zip module.json \
            --title "Twodsix Ledger ${GITHUB_REF_NAME#ledger-v}" \
            --notes "Twodsix Ledger module ${GITHUB_REF_NAME#ledger-v}. Install with the manifest URL in the README."
