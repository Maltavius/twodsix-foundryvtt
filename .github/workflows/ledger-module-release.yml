# Builds the zip for the Twodsix Ledger module and puts it on a GitHub release.
#
# Release by pushing a tag that matches the version in modules/twodsix-ledger/module.json, for example version 0.4.0 is
# released with the tag ledger-v0.4.0. The "download" address in module.json must point at that release.

name: Release the Twodsix Ledger module

on:
  push:
    tags:
      - 'ledger-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/twodsix-ledger
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag, the version and the download address agree
        run: |
          version=$(jq -r .version module.json)
          download=$(jq -r .download module.json)
          if [ "${GITHUB_REF_NAME}" != "ledger-v${version}" ]; then
            echo "The tag is ${GITHUB_REF_NAME}, but module.json has version ${version} (expected ledger-v${version})." >&2
            exit 1
          fi
          case "${download}" in
            */releases/download/${GITHUB_REF_NAME}/twodsix-ledger.zip) ;;
            *) echo "The download address in module.json (${download}) does not point at the release ${GITHUB_REF_NAME}." >&2; exit 1 ;;
          esac

      - name: Check that CHANGELOG.md has an entry for this version
        run: |
          version=$(jq -r .version module.json)
          if ! grep -q "^## ${version}\$" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry '## ${version}'. Write what changed before releasing." >&2
            exit 1
          fi

      - name: Build the zip (module.json must be at the root of it)
        run: |
          zip -r ../../twodsix-ledger.zip module.json README.md CHANGELOG.md scripts styles templates lang

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          manifest=$(jq -r .manifest module.json)
          readme="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/modules/twodsix-ledger/README.md"
          version="${GITHUB_REF_NAME#ledger-v}"
          # The part of CHANGELOG.md that belongs to this version: from its "## <version>" heading to the next "## "
          changes=$(awk -v heading="## ${version}" '$0 == heading {found = 1; next} found && /^## / {exit} found {print}' CHANGELOG.md)
          {
            echo "Twodsix Ledger module ${version}."
            echo
            echo "Install it in Foundry with this manifest URL:"
            echo
            echo "${manifest}"
            echo
            echo "More about the module: ${readme}"
            echo
            echo "## What changed"
            echo
            echo "### ${version}"
            echo "${changes}"
          } > ../../release-notes.md
          gh release create "${GITHUB_REF_NAME}" ../../twodsix-ledger.zip module.json \
            --title "Twodsix Ledger ${GITHUB_REF_NAME#ledger-v}" \
            --notes-file ../../release-notes.md
